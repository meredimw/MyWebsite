<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Murden Cove Kayak Log</title>
  <style>
    :root {
      --max: 980px;
      --gap: 1rem;
      --sidebar: 250px;

      --bg-top: #e0f2fe;
      --bg-bottom: #0f172a;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #0ea5e9;
      --accent-soft: rgba(14,165,233,0.12);
      --accent-strong: #0f766e;
      --shadow-soft: 0 18px 40px rgba(15, 23, 42, 0.12);
      --radius-lg: 18px;
      --radius-md: 10px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(to bottom, var(--bg-top), #e2f3ff 30%, #c7e0ff 55%, #9ca3af 70%, var(--bg-bottom) 100%);
      color: var(--text-main);
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: var(--sidebar);
      background: rgba(15, 23, 42, 0.98);
      color: #f9fafb;
      overflow-y: auto;
      padding: 1.5rem 1rem;
      box-shadow: 2px 0 20px rgba(15, 23, 42, .35);
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .sidebar-title {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .sidebar-badge {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 6px var(--accent-soft);
    }

    .sidebar-subtitle {
      font-size: 0.85rem;
      color: #cbd5f5;
    }

    .sidebar-nav {
      margin-top: 0.5rem;
      border-top: 1px solid rgba(148, 163, 184, 0.4);
      padding-top: 0.75rem;
    }

    .sidebar a {
      display: block;
      padding: 10px 12px;
      color: #e5e7eb;
      text-decoration: none;
      font-size: 0.98rem;
      border-radius: 10px;
    }

    .content { margin-left: var(--sidebar); }

    header {
      padding: 2rem 1.25rem 0.75rem;
      text-align: center;
    }

    main {
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 1.25rem 2.5rem;
    }

    .day {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow-soft);
      text-align: center;
      border: 1px solid rgba(148, 163, 184, 0.35);
    }

    img {
      max-width: 100%;
      border-radius: 14px;
    }

    .route-link {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 14px;
      background: #0ea5e9;
      color: white;
      border-radius: 20px;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="sidebar">
  <h2>Murden Cove</h2>
  <p>Kayaking Log</p>
</div>

<div class="content">
<main>

<!-- 02/08/25 -->
<div class="day">
<h2>02/08/25 Paddle</h2>
<img src="IMG_7965.jpeg">
<br>
<a class="route-link" href="IMG_7964.png" target="_blank">View Route Map</a>
</div>

</main>
</div>

</body>
</html>
