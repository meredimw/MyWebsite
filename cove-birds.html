<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Cove Birds • MurdenCove.com</title>
  <style>
    :root {
      --max: 980px;
      --sidebar: 250px;

      --bg-top: #e0f2fe;
      --bg-bottom: #0f172a;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #0ea5e9;
      --accent-soft: rgba(14,165,233,0.12);
      --accent-strong: #0f766e;
      --shadow-soft: 0 18px 40px rgba(15, 23, 42, 0.12);
      --radius-lg: 18px;
      --radius-md: 10px;
      --pill-bg: rgba(59, 130, 246, 0.06);
      --pill-border: rgba(148, 163, 184, 0.5);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(
        to bottom,
        var(--bg-top),
        #e2f3ff 30%,
        #c7e0ff 55%,
        #9ca3af 70%,
        var(--bg-bottom) 100%
      );
      color: var(--text-main);
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: var(--sidebar);
      background: rgba(15, 23, 42, 0.98);
      color: #f9fafb;
      padding: 1.5rem 1rem;
      box-shadow: 2px 0 20px rgba(15, 23, 42, .35);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .sidebar-title {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .sidebar-badge {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 6px var(--accent-soft);
    }

    .sidebar-subtitle {
      font-size: 0.85rem;
      color: #cbd5f5;
    }

    .sidebar-nav {
      margin-top: 0.5rem;
      border-top: 1px solid rgba(148, 163, 184, 0.4);
      padding-top: 0.75rem;
    }

    .sidebar a {
      display: block;
      padding: 10px 12px;
      color: #e5e7eb;
      text-decoration: none;
      border-radius: 10px;
    }

    .sidebar a:hover { background: rgba(148, 163, 184, 0.18); }

    .sidebar a.current {
      background: rgba(34, 197, 94, 0.16);
      color: #bbf7d0;
    }

    .content { margin-left: var(--sidebar); }

    header {
      padding: 2rem 1.25rem 0.75rem;
      text-align: center;
    }

    header h1 {
      margin: 0 0 .25rem;
      font-size: clamp(1.9rem, 3vw + 1rem, 2.4rem);
    }

    header p {
      margin: 0;
      color: var(--text-muted);
    }

    main {
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 1.25rem 2.5rem;
    }

    .bird-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(148, 163, 184, 0.35);
    }

    .bird-head {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .bird-name { font-size: 1.25rem; margin: 0; }

    .bird-sci {
      font-style: italic;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 0.4rem;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.18rem 0.7rem;
      border-radius: 999px;
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--accent-strong);
    }

    .bird-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 1rem;
    }

    img.bird-photo {
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 14px 32px rgba(15, 23, 42, 0.22);
    }

    .facts {
      background: rgba(2, 6, 23, 0.03);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 16px;
      padding: 0.9rem;
    }

    @media (max-width: 720px) {
      .sidebar { position: static; width: 100%; }
      .content { margin-left: 0; }
    }
  </style>
</head>
