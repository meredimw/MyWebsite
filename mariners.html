<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mariners Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --bg: #0b1120;
      --bg-alt: #020617;
      --card-bg: #0f172a;
      --accent: #22c55e;
      --accent-soft: rgba(34, 197, 94, 0.15);
      --text-main: #e5e7eb;
      --text-muted: #94a3b8;
      --max-width: 960px;
      --radius-lg: 18px;
      --radius-md: 10px;
      --shadow-soft: 0 18px 40px rgba(15, 23, 42, 0.5);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at top, #1e293b 0, var(--bg-alt) 45%, #020617 100%);
      color: var(--text-main);
      min-height: 100vh;
    }

    .page {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 3vw + 1rem, 2.6rem);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    header p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.98rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.25rem 0.75rem;
      margin-bottom: 0.75rem;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.4);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 6px var(--accent-soft);
    }

    .game-list {
      background: linear-gradient(135deg, rgba(15,23,42,0.95), rgba(15,23,42,0.85));
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft);
      padding: 1rem 1.25rem;
      margin-bottom: 2rem;
      border: 1px solid rgba(148, 163, 184, 0.35);
    }

    .game-list h2 {
      margin: 0 0 0.75rem;
      font-size: 1.05rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      color: var(--text-muted);
    }

    .game-list ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 0.35rem;
    }

    .game-list a {
      color: var(--text-main);
      text-decoration: none;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0.35rem 0.15rem;
      border-radius: var(--radius-md);
      transition: background 0.18s ease, transform 0.12s ease;
      font-size: 0.95rem;
    }

    .game-list a span.game-date {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .game-list a:hover {
      background: rgba(15, 23, 42, 0.9);
      transform: translateY(-1px);
    }
