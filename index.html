<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>MurdenCove.com</title>

  <style>
    :root {
      --max: 980px;
      --sidebar: 250px;

      --bg-top: #e0f2fe;
      --bg-bottom: #0f172a;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #0ea5e9;
      --accent-strong: #0f766e;
      --shadow-soft: 0 18px 40px rgba(15, 23, 42, 0.12);
      --radius-lg: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(to bottom, var(--bg-top), #c7e0ff 60%, var(--bg-bottom));
      color: var(--text-main);
    }

    /* SIDEBAR */
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: var(--sidebar);
      background: rgba(15, 23, 42, 0.98);
      color: #f9fafb;
      padding: 1.5rem 1rem;
    }

    .sidebar a {
      display: block;
      padding: 10px 12px;
      color: #e5e7eb;
      text-decoration: none;
      border-radius: 10px;
    }

    .sidebar a.current {
      background: rgba(34, 197, 94, 0.16);
      color: #bbf7d0;
    }

    .content { margin-left: var(--sidebar); }

    header {
      padding: 2rem 1rem;
      text-align: center;
    }

    header h1 { margin: 0; }

    header p { color: var(--text-muted); }

    main {
      max-width: var(--max);
      margin: auto;
      padding: 1rem;
    }

    .hero-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow-soft);
      text-align: center;
    }

    /* MAGAZINE LAYOUT */
    .hero-gallery {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .hero-main {
      height: 100%;
    }

    .hero-side {
      display: grid;
      gap: 0.75rem;
    }

    .hero-gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 16px;
      box-shadow: 0 14px 32px rgba(15, 23, 42, 0.28);
      transition: transform 0.2s ease;
    }

    .hero-gallery img:hover {
      transform: scale(1.02);
    }

    .hero-main img {
      height: 100%;
      min-height: 300px;
    }

    .hero-side img {
      height: 146px;
    }

    .hero-links {
      margin-top: 1rem;
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .hero-link {
      padding: 0.5rem 1rem;
      color: white;
      background: linear-gradient(135deg, var(--accent-strong), var(--accent));
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
    }

    @media(max-width:720px){
      .sidebar{position:static;width:100%;}
      .content{margin-left:0;}

      .hero-gallery {
        grid-template-columns: 1fr;
      }

      .hero-side img {
        height: 200px;
      }
    }
  </style>
</head>

<body>

<nav class="sidebar">
  <a href="index.html" class="current">Home</a>
  <a href="kayak.html">Paddle Log</a>
  <a href="cove-birds.html">Cove Birds</a>
  <a href="cove-critters.html">Cove Critters</a>
  <a href="frog-rock.html">Frog Rock</a>
</nav>

<div class="content">

<header>
  <h1>MurdenCove.com</h1>
  <p>Photos, paddles, and little things I love about Bainbridge Island’s coves.</p>
</header>

<main>
  <section class="hero-card">

    <h2>Welcome to the Cove</h2>
    <p>
      A quiet corner for kayak trips, shoreline discoveries,
      and life around Murden Cove.
    </p>

    <!-- MAGAZINE STYLE -->
    <div class="hero-gallery">
      <div class="hero-main">
        <img src="IMG_6949.jpg">
      </div>

      <div class="hero-side">
        <img src="man.jpg">
        <img src="rainbow.jpg">
      </div>
    </div>

    <div class="hero-links">
      <a class="hero-link" href="kayak.html">Paddle Log</a>
      <a class="hero-link" href="cove-birds.html">Cove Birds</a>
      <a class="hero-link" href="cove-critters.html">Cove Critters</a>
      <a class="hero-link" href="frog-rock.html">Frog Rock</a>
    </div>

  </section>
</main>

</div>

</body>
</html>
